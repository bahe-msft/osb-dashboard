{{define "sandbox-row-core"}}
<span class="status-ring" data-status="{{.State}}" aria-hidden="true"></span>
<div class="sandbox-headline">
  <span class="sandbox-name">{{.Name}}</span>
</div>
<span class="sandbox-updated">
  <span class="sandbox-runtime" title="{{.Namespace}} / {{.PodName}}">{{.Namespace}} / {{.PodName}}</span>
</span>
<span class="sandbox-specs" title="{{.Image}} · {{.Resources}}">
  <span class="sandbox-image"><i data-lucide="disc" aria-hidden="true"></i><span>{{.Image}}</span></span>
  <span class="metadata-separator" aria-hidden="true">·</span>
  <span class="sandbox-resources"><i data-lucide="cpu" aria-hidden="true"></i><span>{{.Resources}}</span></span>
</span>
{{end}}
